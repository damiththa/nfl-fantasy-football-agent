name: Render Architecture Diagrams (Archify)

on:
  push:
    paths:
      - "docs/architecture.json"
      - "docs/api-data-flow.json"
      - ".github/workflows/archify.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-architecture:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Clone Archify Engine
        run: |
          git clone --depth 1 https://github.com/tt-a1i/archify.git /tmp/archify

      - name: Render System Architecture Diagram
        run: |
          node /tmp/archify/archify/bin/archify.mjs render architecture docs/architecture.json docs/architecture.html
          if [ ! -f docs/architecture.html ]; then
            echo "::error::Archify failed to produce docs/architecture.html"
            exit 1
          fi

      - name: Render API & Data Flow Diagram
        run: |
          if [ -f docs/api-data-flow.json ]; then
            node /tmp/archify/archify/bin/archify.mjs render architecture docs/api-data-flow.json docs/api-data-flow.html
            if [ ! -f docs/api-data-flow.html ]; then
              echo "::error::Archify failed to produce docs/api-data-flow.html"
              exit 1
            fi
          fi

      - name: Extract Standalone SVGs
        run: |
          python3 -c "
          import re, xml.etree.ElementTree as ET, os

          def extract_svg(html_path, svg_path):
              with open(html_path, 'r', encoding='utf-8') as f:
                  html = f.read()
              styles = re.findall(r'<style[^>]*>(.*?)</style>', html, re.DOTALL)
              combined_style = styles[0] + '\n' + styles[1]
              svg_match = re.search(r'<svg([^>]*)>(.*?)</svg>', html, re.DOTALL)
              svg_attrs = svg_match.group(1)
              if 'xmlns=' not in svg_attrs:
                  svg_attrs = ' xmlns=\"http://www.w3.org/2000/svg\"' + svg_attrs
              svg_full = f'<svg{svg_attrs}>\n<style><![CDATA[\n{combined_style}\n]]></style>\n<rect width=\"100%\" height=\"100%\" fill=\"#020617\" rx=\"12\"/>\n{svg_match.group(2)}\n</svg>'
              with open(svg_path, 'w', encoding='utf-8') as out:
                  out.write(svg_full)
              tree = ET.parse(svg_path)
              print(f'Extracted valid standalone {svg_path}')

          extract_svg('docs/architecture.html', 'docs/architecture.svg')
          if os.path.exists('docs/api-data-flow.html'):
              extract_svg('docs/api-data-flow.html', 'docs/api-data-flow.svg')
          "

      - name: Commit & Push Rendered Diagrams
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/architecture.html docs/architecture.svg
          git add docs/api-data-flow.html docs/api-data-flow.svg 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Diagrams are up to date, no changes to commit."
          else
            git commit -m "docs: auto-render Archify architecture diagrams (HTML + SVG) [skip ci]"
            git push
          fi
