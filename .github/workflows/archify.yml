name: Render Architecture Diagram (Archify)

on:
  push:
    paths:
      - "docs/architecture.json"
      - ".github/workflows/archify.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-architecture:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Clone Archify Engine
        run: |
          git clone --depth 1 https://github.com/tt-a1i/archify.git /tmp/archify

      - name: Render Architecture Diagram
        run: |
          node /tmp/archify/archify/bin/archify.mjs render architecture docs/architecture.json docs/architecture.html 2>&1 | tee /tmp/archify.log || true
          echo "=== ARCHIFY LOG ==="
          cat /tmp/archify.log
          if [ ! -f docs/architecture.html ]; then
            echo "::error::Archify failed to produce docs/architecture.html"
            exit 1
          fi

      - name: Commit & Push Rendered Diagram
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/architecture.html
          if git diff --staged --quiet; then
            echo "Diagram is up to date, no changes to commit."
          else
            git commit -m "docs: auto-render Archify architecture diagram [skip ci]"
            git push
          fi
